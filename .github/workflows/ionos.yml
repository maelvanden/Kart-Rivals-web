name: Publication IONOS
on:
  push:
    branches: [main]
    paths: [".github/workflows/ionos.yml"]
  workflow_dispatch:
    inputs:
      operation:
        description: "Verifier la connexion ou publier le dossier public/"
        required: true
        default: verifier
        type: choice
        options:
          - verifier
          - publier
permissions:
  contents: read
concurrency:
  group: ionos-production
  cancel-in-progress: false
jobs:
  sftp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "paramiko==4.0.0"
      - name: Connexion et publication SFTP
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_HOST_FINGERPRINT: ${{ vars.IONOS_HOST_FINGERPRINT }}
          IONOS_REMOTE_DIR: ${{ vars.IONOS_REMOTE_DIR }}
          OPERATION: ${{ inputs.operation || 'verifier' }}
        shell: python
        run: |
          import base64
          import errno
          import hashlib
          import hmac
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import paramiko

          for name in ("IONOS_SFTP_HOST", "IONOS_SFTP_USER", "IONOS_SFTP_PASSWORD"):
              if not os.environ.get(name):
                  raise SystemExit("Secret manquant : " + name)

          class PinnedHost(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual = "SHA256:" + base64.b64encode(
                      hashlib.sha256(key.asbytes()).digest()
                  ).decode().rstrip("=")
                  expected = os.environ.get("IONOS_HOST_FINGERPRINT", "").strip() or (
                      # IONOS official ED25519 fingerprint, verified 2026-10-28:
                      # https://www.ionos.de/hilfe/hosting/ssh-zugaenge-einrichten-und-verwalten/uebersicht-der-ssh-fingerabdruecke-im-ionos-webhosting/
                      "SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q"
                  )
                  if not expected:
                      print("Empreinte presentee par le serveur : " + actual)
                      raise paramiko.SSHException(
                          "Verifier cette empreinte aupres de IONOS puis definir "
                          "la variable GitHub IONOS_HOST_FINGERPRINT. "
                          "Aucun mot de passe transmis au serveur."
                      )
                  if not hmac.compare_digest(actual, expected):
                      raise paramiko.SSHException("Empreinte du serveur incorrecte.")

          with paramiko.SSHClient() as client:
              client.set_missing_host_key_policy(PinnedHost())
              client.connect(
                  hostname=os.environ["IONOS_SFTP_HOST"], port=22,
                  username=os.environ["IONOS_SFTP_USER"],
                  password=os.environ["IONOS_SFTP_PASSWORD"],
                  allow_agent=False, look_for_keys=False,
                  timeout=30, banner_timeout=30, auth_timeout=30,
              )
              with client.open_sftp() as sftp:
                  print("Connexion SFTP reussie.")
                  if os.environ["OPERATION"] == "verifier":
                      print("Aucun fichier modifie.")
                  else:
                      raw_target = os.environ.get("IONOS_REMOTE_DIR", "").strip()
                      target = PurePosixPath(raw_target)
                      if not raw_target or str(target) in (".", "/") or ".." in target.parts:
                          raise SystemExit("Definir IONOS_REMOTE_DIR vers un dossier dedie au site.")
                      source = Path("public")
                      if not source.is_dir() or not any(
                          (source / name).is_file() for name in ("index.html", "index.php")
                      ):
                          raise SystemExit("Ajouter le site dans public/ avec index.html ou index.php.")
                      paths = sorted(source.rglob("*"))
                      if any(p.is_symlink() for p in paths):
                          raise SystemExit("Les liens symboliques ne sont pas autorises.")

                      def ensure_dir(path):
                          try:
                              info = sftp.lstat(str(path))
                          except OSError as exc:
                              if exc.errno != errno.ENOENT:
                                  raise
                              if path.parent != path and str(path.parent) != ".":
                                  ensure_dir(path.parent)
                              sftp.mkdir(str(path))
                              return
                          if not stat.S_ISDIR(info.st_mode):
                              raise SystemExit("Le chemin distant doit etre un dossier reel.")

                      ensure_dir(target)
                      count = 0
                      for local in paths:
                          remote = target / local.relative_to(source).as_posix()
                          if local.is_dir():
                              ensure_dir(remote)
                          elif local.is_file():
                              try:
                                  info = sftp.lstat(str(remote))
                              except OSError as exc:
                                  if exc.errno != errno.ENOENT:
                                      raise
                              else:
                                  if not stat.S_ISREG(info.st_mode):
                                      raise SystemExit("La destination doit etre un fichier ordinaire.")
                              sftp.put(str(local), str(remote), confirm=True)
                              count += 1
                      print(str(count) + " fichiers transferes. Aucun fichier distant supprime.")
